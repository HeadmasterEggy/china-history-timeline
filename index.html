<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>华夏历史长卷</title>
<meta name="description" content="从夏朝到中华人民共和国：按真实时间比例排布的中国历代政权交互时间轴。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;900&display=swap">
<style>
/* 布局：一幅横向展开的"长卷"——上方全景缩略条，中部按真实年份比例排布的政权泳道，下方为选中朝代的详情与全部朝代一览 */
:root{
  --paper:#ECEEE8; --surface:#F7F8F4; --ink:#1B2124; --muted:#5B6662; --line:#CBD2CA;
  --accent:#2C5C8C; --seal:#A8372B; --on-era:#FFFFFF;
  --e-xianqin:#94642F; --e-qinhan:#AE412E; --e-weijin:#93405C; --e-suitang:#A47F10;
  --e-songyuan:#2C785D; --e-mingqing:#2D5F9C; --e-modern:#4A546D;
  --f-brush:"Ma Shan Zheng","STKaiti","KaiTi","Kaiti SC",serif;
  --f-serif:"Noto Serif SC","Songti SC","SimSun",serif;
  --f-sans:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --lane-h:46px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#101516; --surface:#182022; --ink:#E2E6E0; --muted:#98A29D; --line:#2C3638;
    --accent:#86AEDB; --seal:#E27563; --on-era:#0E1314;
    --e-xianqin:#D39D60; --e-qinhan:#E2755E; --e-weijin:#D27C98; --e-suitang:#D8B44A;
    --e-songyuan:#62BB97; --e-mingqing:#76A2DC; --e-modern:#98A2C0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#101516; --surface:#182022; --ink:#E2E6E0; --muted:#98A29D; --line:#2C3638;
  --accent:#86AEDB; --seal:#E27563; --on-era:#0E1314;
  --e-xianqin:#D39D60; --e-qinhan:#E2755E; --e-weijin:#D27C98; --e-suitang:#D8B44A;
  --e-songyuan:#62BB97; --e-mingqing:#76A2DC; --e-modern:#98A2C0;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.7 var(--f-sans);
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{text-wrap:balance;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* —— 卷首 —— */
header.top{padding-block:36px 20px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px 40px;justify-content:space-between}
.title{display:flex;align-items:center;gap:18px}
.seal{width:58px;height:58px;flex:none;border:2px solid var(--seal);border-radius:6px;color:var(--seal);
  display:grid;grid-template-columns:1fr 1fr;place-items:center;font:900 19px/1 var(--f-serif);padding:5px}
h1{font:400 clamp(40px,6vw,64px)/1 var(--f-brush);letter-spacing:.04em}
.sub{color:var(--muted);margin-top:8px;font-size:14px}
.facts{display:flex;gap:28px;flex-wrap:wrap}
.fact b{display:block;font:900 26px/1.1 var(--f-serif);font-variant-numeric:tabular-nums}
.fact span{font-size:12px;color:var(--muted);letter-spacing:.08em}

/* —— 全景缩略条 —— */
.mini{position:relative;height:30px;border-radius:4px;overflow:hidden;display:flex;cursor:pointer;
  border:1px solid var(--line);touch-action:none;user-select:none}
.mini i{display:block;height:100%;background:color-mix(in srgb,var(--c) 30%,var(--surface));
  border-right:1px solid var(--surface);font:500 11px/30px var(--f-sans);font-style:normal;
  color:var(--ink);text-align:center;overflow:hidden;white-space:nowrap}
.mini .view{position:absolute;top:0;bottom:0;border:2px solid var(--ink);border-radius:3px;
  background:color-mix(in srgb,var(--ink) 8%,transparent);pointer-events:none}
.mini-cap{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}

/* —— 工具条 —— */
.tools{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding-block:16px 10px}
.eras{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px 3px 10px;
  font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--c)}
.chip:hover{border-color:var(--c)}
.spacer{flex:1}
.zoom{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.zoom button{width:30px;height:30px;border:1px solid var(--line);background:var(--surface);border-radius:6px;cursor:pointer;font-size:17px;line-height:1}
.zoom input{width:120px;accent-color:var(--accent)}
.search{position:relative}
.search input{width:220px;max-width:100%;padding:6px 12px;border:1px solid var(--line);border-radius:6px;
  background:var(--surface);color:var(--ink);font:inherit;font-size:14px}
.search small{position:absolute;left:0;top:100%;font-size:12px;color:var(--muted);white-space:nowrap}

/* —— 长卷 —— */
.scroll{overflow-x:auto;overflow-y:hidden;background:var(--surface);border:1px solid var(--line);border-radius:8px;
  margin-top:14px;cursor:grab;scrollbar-color:var(--line) transparent}
.scroll.drag{cursor:grabbing}
.canvas{position:relative}
.band{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--c) 6%,transparent);border-left:1px dashed color-mix(in srgb,var(--c) 45%,transparent)}
.band span{position:sticky;left:8px;display:inline-block;margin:6px 8px;font:600 13px/1 var(--f-serif);color:var(--c);letter-spacing:.1em;white-space:nowrap}
.pin{position:absolute;height:20px;display:flex;align-items:center;gap:4px;font-size:12px;white-space:nowrap;
  color:var(--muted);background:none;border:0;padding:0 2px;cursor:pointer}
.pin::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--seal);flex:none;margin-left:-5.5px}
.pin:hover,.pin.on{color:var(--seal)}
.pinline{position:absolute;width:1px;background:color-mix(in srgb,var(--seal) 35%,transparent);pointer-events:none}
.lane-label{position:sticky;left:0;z-index:3;width:0;height:0}
.blk{position:absolute;height:calc(var(--lane-h) - 8px);border-radius:4px;cursor:pointer;
  background:color-mix(in srgb,var(--c) 22%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 60%,transparent);
  display:flex;flex-direction:column;justify-content:center;padding:0 8px;overflow:hidden;text-align:left;
  transition:background .15s,opacity .15s}
.blk b{font:600 15px/1.15 var(--f-serif);white-space:nowrap}
.blk small{font-size:11px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.blk.major b{font-weight:900;font-size:17px}
.blk.tiny{padding:0}
.blk.tiny b,.blk.tiny small,.blk.narrow small{display:none}
.blk:hover{background:color-mix(in srgb,var(--c) 38%,var(--surface))}
.blk.on{background:var(--c);border-color:var(--c);color:var(--on-era);z-index:2}
.blk.on small{color:var(--on-era);opacity:.85}
.blk.dim{opacity:.18}
.blk.hit{box-shadow:0 0 0 2px var(--seal)}
.axis{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.tick{position:absolute;top:0;font-size:11px;color:var(--muted);transform:translateX(-50%);padding-top:5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.tick::before{content:"";position:absolute;left:50%;top:0;height:5px;border-left:1px solid var(--line)}
.tick.zero{color:var(--ink);font-weight:700}
.grid{position:absolute;width:1px;background:color-mix(in srgb,var(--line) 55%,transparent);pointer-events:none}
.hint{font-size:12px;color:var(--muted);margin-top:6px}

/* —— 详情 —— */
.detail{margin-top:28px;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:20px 40px;
  padding-block:28px;border-top:3px solid var(--c);}
.d-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.d-era{font-size:12px;letter-spacing:.14em;color:var(--c);font-weight:700}
.d-name{font:900 clamp(38px,5vw,56px)/1.05 var(--f-serif)}
.d-years{font-size:17px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:6px}
.d-sum{margin:16px 0 18px;max-width:34em}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0}
dl.kv dt{color:var(--muted);font-size:13px;padding-top:1px}
dl.kv dd{margin:0}
.people{display:flex;flex-wrap:wrap;gap:6px}
.people span{border:1px solid var(--line);border-radius:4px;padding:0 8px;font-size:13px;background:var(--surface)}
.nav{display:flex;gap:10px;margin-top:22px}
.nav button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 12px;cursor:pointer;text-align:left;font-size:13px;color:var(--muted)}
.nav button b{display:block;color:var(--ink);font:600 16px/1.3 var(--f-serif)}
.nav button:last-child{text-align:right}
.nav button:disabled{opacity:.4;cursor:default}
.ev-title{font:600 13px/1 var(--f-sans);letter-spacing:.14em;color:var(--muted);margin-bottom:12px}
ol.events{list-style:none;margin:0;padding:0;position:relative}
ol.events::before{content:"";position:absolute;left:84px;top:8px;bottom:8px;border-left:1px solid var(--line)}
ol.events li{display:grid;grid-template-columns:76px 1fr;gap:26px;padding:7px 0;position:relative}
ol.events li::before{content:"";position:absolute;left:80px;top:15px;width:9px;height:9px;border-radius:50%;
  background:var(--surface);border:2px solid var(--c)}
ol.events time{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}

/* —— 一览 —— */
section.list{padding-block:20px 60px}
section.list h2{font:900 26px/1.2 var(--f-serif);margin-bottom:4px}
section.list > p{color:var(--muted);margin:0 0 18px}
.era-grp{margin-top:22px}
.era-grp h3{font:600 15px/1 var(--f-serif);color:var(--c);letter-spacing:.12em;padding-bottom:8px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.era-grp h3 span{font:400 12px var(--f-sans);color:var(--muted);letter-spacing:0;font-variant-numeric:tabular-nums}
.row{display:grid;grid-template-columns:8em 11em 4.5em minmax(0,1fr);gap:12px;align-items:center;width:100%;
  padding:7px 4px;border:0;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent);background:none;cursor:pointer;text-align:left}
.row:hover{background:color-mix(in srgb,var(--c) 8%,transparent)}
.row.on{background:color-mix(in srgb,var(--c) 14%,transparent)}
.row b{font:600 15px var(--f-serif)}
.row .yr,.row .dur{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.row .dur{text-align:right}
.row .bar{height:8px;border-radius:2px;background:var(--c);opacity:.75}
footer{color:var(--muted);font-size:12px;padding-block:0 40px}
@media (max-width:760px){
  .detail{grid-template-columns:minmax(0,1fr)}
  .row{grid-template-columns:6.5em 1fr 3.5em}
  .row .bar{display:none}
  .search input{width:100%}
  .search{flex:1 1 100%}
  .spacer{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap">

      <div class="seal" aria-hidden="true"><span>华</span><span>夏</span><span>长</span><span>卷</span></div>
      <div>
        <h1>华夏历史长卷</h1>
        <div class="sub">按真实年份比例排布的中国历代政权。并列的泳道表示同一时期并存的政权。</div>
      </div>
    </div>
    <div class="facts" id="facts"></div>
  </header>

  <div class="mini" id="mini" role="slider" aria-label="全景缩略条，点击或拖动以跳转" tabindex="0"></div>

      <input id="q" type="search" placeholder="搜索朝代、人物或事件" autocomplete="off">

  <div class="scroll" id="scroll"><div class="canvas" id="canvas"></div></div>
  <div class="hint">拖动长卷可左右移动；点击色块查看详情；键盘 ← → 切换相邻朝代。</div>

  <article class="detail" id="detail"></article>

  <section class="list">

  </section>
  <footer>年代采用通行说法，上古年代依据"夏商周断代工程"等研究，均为约数；部分政权起止年存在不同观点。</footer>
</div>

 {id:'xia',n:'夏',s:-2070,e:-1600,era:'xianqin',lane:0,major:1,approx:1,f:'禹、启',c:'阳城、斟鄩等（今河南登封、偃师一带，传说）',

  ev:[[-1046,'牧野之战，周武王灭商建周'],[-1042,'周公摄政，平定三监之乱，营建洛邑'],[-841,'国人暴动，周厉王出奔，"共和行政"，中国确切纪年由此开始'],[-771,'犬戎攻破镐京，周幽王被杀，西周灭亡']],

 {id:'qin',n:'秦',s:-221,e:-207,era:'qinhan',lane:0,major:1,f:'秦始皇嬴政',c:'咸阳（今陕西咸阳）',

  ev:[[-221,'秦灭齐，统一六国，嬴政称"始皇帝"，推行郡县制'],[-221,'统一文字（小篆）、货币、度量衡、车轨'],[-214,'修筑长城，开凿灵渠'],[-213,'焚书，次年坑儒'],[-210,'秦始皇病逝于沙丘'],[-209,'陈胜、吴广大泽乡起义'],[-207,'秦王子婴降刘邦']],

 {id:'xihan',n:'西汉',s:-202,e:8,era:'qinhan',lane:0,major:1,f:'汉高祖刘邦',c:'长安（今陕西西安）',

  sum:'汉族建立的最后一个统一王朝。废丞相，强化君主集权；郑和七下西洋；修筑今日所见的长城；后期商品经济活跃，西学东渐。',
  ev:[[1368,'朱元璋在南京称帝'],[1380,'废除丞相制度'],[1405,'郑和第一次下西洋（至1433年共七次）'],[1421,'迁都北京'],[1449,'土木之变，明英宗被俘'],[1573,'张居正改革'],[1578,'李时珍完成《本草纲目》'],[1644,'李自成攻破北京，崇祯帝自缢']],
  p:['朱元璋','朱棣','郑和','于谦','王阳明','戚继光','张居正','李时珍','徐光启']},
 {id:'houjin2',n:'后金',s:1616,e:1644,era:'mingqing',lane:1,f:'努尔哈赤',c:'赫图阿拉，后迁盛京（今沈阳）',
  sum:'女真首领努尔哈赤建立，1636年皇太极改国号为"清"，改族名为"满洲"。此处为清入关前时期。',
  ev:[[1616,'努尔哈赤称汗，建立后金'],[1619,'萨尔浒之战大败明军'],[1625,'迁都沈阳'],[1636,'皇太极称帝，改国号"清"']],
  p:['努尔哈赤','皇太极','多尔衮']},
 {id:'nanming',n:'南明',s:1644,e:1662,era:'mingqing',lane:1,f:'弘光帝朱由崧等',c:'南京、福州、肇庆等',
  sum:'明亡后宗室在南方相继建立的政权，抗清约二十年。',
  ev:[[1644,'福王在南京即位'],[1645,'扬州之战，史可法殉国'],[1661,'郑成功收复台湾（1662年荷兰人投降）'],[1662,'永历帝被杀，南明结束']],
  p:['史可法','郑成功','李定国']},
 {id:'qing',n:'清',s:1636,e:1912,ds:1644,era:'mingqing',lane:0,major:1,f:'清太宗皇太极（1636年改国号）',c:'北京（入关后）',
  sum:'中国最后一个帝制王朝，奠定了近代中国的疆域基础。前期康雍乾盛世，后期在列强侵略和内部危机中衰落，最终被辛亥革命推翻。（1644年入关）',
  ev:[[1644,'清军入关，定都北京'],[1683,'统一台湾，次年设台湾府'],[1689,'中俄《尼布楚条约》'],[1793,'英国马戛尔尼使团来华'],[1840,'鸦片战争爆发'],[1842,'《南京条约》签订'],[1851,'太平天国运动（至1864年）'],[1861,'洋务运动开始'],[1894,'甲午战争'],[1898,'戊戌变法'],[1911,'辛亥革命'],[1912,'宣统帝退位，清亡']],
  p:['康熙','雍正','乾隆','曹雪芹','林则徐','曾国藩','左宗棠','李鸿章','康有为']},

 {id:'minguo',n:'中华民国',s:1912,e:1949,era:'modern',lane:0,major:1,f:'孙中山（临时大总统）',c:'南京、北京',
  sum:'亚洲第一个民主共和国，结束两千多年帝制。经历军阀混战、北伐、十四年抗日战争和国共内战。1949年国民政府迁往台湾。',
  ev:[[1912,'中华民国成立，孙中山就任临时大总统'],[1915,'新文化运动兴起'],[1919,'五四运动'],[1921,'中国共产党成立'],[1924,'第一次国共合作'],[1928,'东北易帜，全国形式上统一'],[1931,'九一八事变'],[1937,'七七事变，全面抗战爆发'],[1945,'抗日战争胜利'],[1949,'国民政府迁往台湾']],
  p:['孙中山','袁世凯','蔡元培','鲁迅','蒋介石','毛泽东']},
 {id:'prc',n:'中华人民共和国',s:1949,e:NOW,era:'modern',lane:0,major:1,open:1,f:'毛泽东',c:'北京',
  sum:'1949年10月1日成立。经过社会主义建设和1978年开始的改革开放，成为世界第二大经济体。',
  ev:[[1949,'10月1日中华人民共和国成立'],[1953,'第一个五年计划开始'],[1964,'第一颗原子弹爆炸成功'],[1971,'恢复在联合国的合法席位'],[1978,'改革开放开始'],[1997,'香港回归'],[1999,'澳门回归'],[2001,'加入世界贸易组织'],[2003,'神舟五号载人航天成功'],[2008,'北京奥运会']],
  p:['毛泽东','周恩来','邓小平']}
];
const PINS=[
 [-2070,'夏朝建立','xia'],[-1300,'盘庚迁殷','shang'],[-1046,'牧野之战','xizhou'],[-841,'共和行政','xizhou'],[-770,'平王东迁','chunqiu'],
 [-551,'孔子诞生','chunqiu'],[-356,'商鞅变法','zhanguo'],[-221,'秦统一六国','qin'],[-138,'张骞出使西域','xihan'],[105,'蔡伦改进造纸','donghan'],
 [208,'赤壁之战','donghan'],[383,'淝水之战','dongjin'],[494,'孝文帝迁洛','beiwei'],[605,'开凿大运河','sui'],[627,'贞观之治','tang'],
 [755,'安史之乱','tang'],[960,'陈桥兵变','beisong'],[1127,'靖康之变','beisong'],[1279,'元统一全国','yuan'],[1405,'郑和下西洋','ming'],
 [1644,'清军入关','qing'],[1840,'鸦片战争','qing'],[1911,'辛亥革命','qing'],[1949,'新中国成立','prc'],[1978,'改革开放','prc']
];

const MIN=-2150, MAX=NOW+30, PAD=24, LANES=4;
const ERA_BY=Object.fromEntries(ERAS.map(e=>[e.id,e]));
const ORDER=[...D].sort((a,b)=>a.s-b.s||a.lane-b.lane);
const $=id=>document.getElementById(id);
const fy=y=>y<0?`前${-y}年`:`${y}年`;
const span=d=>(d.approx?'约':'')+fy(d.s)+' – '+(d.open?'今':fy(d.e));
const dur=d=>d.e-d.s+(d.s<0&&d.e>0?-1:0);
const ec=id=>`var(--e-${id})`;
let ppy=1, sel=null, matches=null;

// 缩放：滑块 0-100 映射到 0.25-10 像素/年（对数）
const z2p=v=>0.25*Math.pow(40,v/100), p2z=p=>100*Math.log(p/0.25)/Math.log(40);
const X=y=>PAD+(y-MIN)*ppy;

const scroll=$('scroll'), canvas=$('canvas');
const TOP_PINS=56, AXIS_H=26;
const laneTop=l=>TOP_PINS+8+l*parseInt(getComputedStyle(document.documentElement).getPropertyValue('--lane-h'));

function render(){
  const LH=parseInt(getComputedStyle(document.documentElement).getPropertyValue('--lane-h'));
  const W=X(MAX)+PAD, H=TOP_PINS+8+LANES*LH+AXIS_H+6;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  let h='';
  for(const e of ERAS){
    h+=`<div class="band" style="--c:${ec(e.id)};left:${X(e.s)}px;width:${X(e.e)-X(e.s)}px"><span>${e.name}</span></div>`;
  }
  // 网格与刻度
  const steps=[10,20,25,50,100,200,250,500,1000];
  const step=steps.find(s=>s*ppy>=80)||1000;
  const axisY=TOP_PINS+8+LANES*LH+4;
  let ticks='';
  for(let y=Math.ceil(MIN/step)*step;y<=MAX;y+=step){
    h+=`<div class="grid" style="left:${X(y)}px;top:${TOP_PINS}px;height:${axisY-TOP_PINS}px"></div>`;
    ticks+=`<div class="tick${y===0?' zero':''}" style="left:${X(y)}px">${y===0?'公元元年':(y<0?'前'+(-y):y)}</div>`;
  }
  // 大事件针
  let rowEnd=[-1e9,-1e9];
  for(const [y,t,id] of PINS){
    const x=X(y), w=t.length*12+16;
    let r=x>rowEnd[0]+6?0:(x>rowEnd[1]+6?1:-1);
    if(r<0){r=rowEnd[0]<rowEnd[1]?0:1}
    rowEnd[r]=x+w;
    const top=6+r*22+18;
    h+=`<div class="pinline" style="left:${x}px;top:${top+10}px;height:${TOP_PINS+8-top-10}px"></div>`;
    h+=`<button class="pin" data-id="${id}" data-y="${y}" style="left:${x}px;top:${top}px" title="${fy(y)} ${t}">${t}</button>`;
  }
  // 朝代色块
  for(const d of D){
    const l=X(d.ds??d.s), w=Math.max(3,X(d.e)-l);
    const tiny=w<(d.n.length*16+14), narrow=w<120;
    h+=`<button class="blk${d.major?' major':''}${tiny?' tiny':''}${narrow?' narrow':''}" data-id="${d.id}" style="--c:${ec(d.era)};left:${l}px;width:${w}px;top:${laneTop(d.lane)+4}px" title="${d.n}  ${span(d)}" aria-label="${d.n}，${span(d)}"><b>${d.n}</b><small>${span(d)}</small></button>`;
  }
  h+=`<div class="axis" style="top:${axisY}px">${ticks}</div>`;
  canvas.innerHTML=h;
  paintState();
  updateMini();
}

function paintState(){
  canvas.querySelectorAll('.blk').forEach(b=>{
    const id=b.dataset.id;
    b.classList.toggle('on',sel&&sel.id===id);
    b.classList.toggle('dim',!!matches&&!matches.has(id));
    b.classList.toggle('hit',!!matches&&matches.has(id)&&!(sel&&sel.id===id));
  });
  canvas.querySelectorAll('.pin').forEach(p=>p.classList.toggle('on',sel&&sel.id===p.dataset.id));
  document.querySelectorAll('.row').forEach(r=>r.classList.toggle('on',sel&&sel.id===r.dataset.id));
}

// 全景缩略条
const mini=$('mini');
function buildMini(){
  const tot=MAX-MIN;
  let h=`<i style="--c:var(--line);flex:${ERAS[0].s-MIN}"></i>`;
  for(const e of ERAS) h+=`<i style="--c:${ec(e.id)};flex:${e.e-e.s}">${e.name}</i>`;
  h+=`<i style="--c:var(--line);flex:${MAX-NOW}"></i><div class="view" id="view"></div>`;
  mini.innerHTML=h;
}
function updateMini(){
  const v=$('view'); if(!v) return;
  const W=canvas.offsetWidth, mw=mini.clientWidth;
  v.style.left=(scroll.scrollLeft/W*mw)+'px';
  v.style.width=Math.max(6,scroll.clientWidth/W*mw)+'px';
}
function miniJump(ev){
  const r=mini.getBoundingClientRect();
  const f=(ev.clientX-r.left)/r.width;
  scroll.scrollLeft=f*canvas.offsetWidth-scroll.clientWidth/2;
}
let miniDrag=false;
mini.addEventListener('pointerdown',e=>{miniDrag=true;mini.setPointerCapture(e.pointerId);miniJump(e)});
mini.addEventListener('pointermove',e=>{if(miniDrag)miniJump(e)});
mini.addEventListener('pointerup',()=>miniDrag=false);
mini.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'){scroll.scrollLeft+=scroll.clientWidth*.5;e.preventDefault()}
  if(e.key==='ArrowLeft'){scroll.scrollLeft-=scroll.clientWidth*.5;e.preventDefault()}
});
scroll.addEventListener('scroll',updateMini,{passive:true});

// 拖动长卷
let drag=null, moved=false;
scroll.addEventListener('pointerdown',e=>{
  if(e.pointerType!=='mouse')return;
  drag={x:e.clientX,s:scroll.scrollLeft};moved=false;
});
window.addEventListener('pointermove',e=>{
  if(!drag)return;
  const dx=e.clientX-drag.x;
  if(Math.abs(dx)>4){moved=true;scroll.classList.add('drag')}
  if(moved)scroll.scrollLeft=drag.s-dx;
});
window.addEventListener('pointerup',()=>{drag=null;scroll.classList.remove('drag')});
canvas.addEventListener('click',e=>{
  if(moved){moved=false;return}
  const t=e.target.closest('[data-id]');
  if(t)select(t.dataset.id,{center:true});
});

// 缩放（保持视野中心年份不变）
function setZoom(v){
  v=Math.max(0,Math.min(100,v));
  const centerYear=MIN+(scroll.scrollLeft+scroll.clientWidth/2-PAD)/ppy;
  $('zoom').value=v; ppy=z2p(v); render();
  scroll.scrollLeft=X(centerYear)-scroll.clientWidth/2;
}
$('zoom').addEventListener('input',e=>setZoom(+e.target.value));
$('zin').onclick=()=>setZoom(+$('zoom').value+10);
$('zout').onclick=()=>setZoom(+$('zoom').value-10);
scroll.addEventListener('wheel',e=>{
  if(e.ctrlKey||e.metaKey){e.preventDefault();setZoom(+$('zoom').value-Math.sign(e.deltaY)*5);return}
  if(Math.abs(e.deltaY)>Math.abs(e.deltaX)&&!e.shiftKey){scroll.scrollLeft+=e.deltaY;e.preventDefault()}
},{passive:false});

// 时代快速跳转
$('eras').innerHTML=ERAS.map(e=>`<button class="chip" style="--c:${ec(e.id)}" data-era="${e.id}">${e.name}</button>`).join('');
$('eras').addEventListener('click',e=>{
  const b=e.target.closest('[data-era]'); if(!b)return;
  const era=ERA_BY[b.dataset.era];
  const first=ORDER.find(d=>d.era===era.id&&d.lane===0);
  scroll.scrollTo({left:X(era.s)-40,behavior:'smooth'});
  if(first)select(first.id,{center:false});
});

// 选择与详情
function select(id,{center=false,scrollDetail=false}={}){
  const d=D.find(x=>x.id===id); if(!d)return;
  sel=d;
  try{history.replaceState(null,'','#'+id)}catch(_){}
  const i=ORDER.indexOf(d), prev=ORDER[i-1], next=ORDER[i+1];
  const era=ERA_BY[d.era];
  const det=$('detail');
  det.style.setProperty('--c',ec(d.era));
  det.innerHTML=`
    <div>
      <div class="d-era">${era.name}${d.lane>0?' · 并存政权':''}</div>
      <div class="d-head"><h2 class="d-name">${d.n}</h2></div>
      <div class="d-years">${span(d)}　·　${d.open?'至今 ':'历时约 '}${dur(d)} 年</div>
      <p class="d-sum">${d.sum}</p>
      <dl class="kv">
        <dt>建立者</dt><dd>${d.f}</dd>
        <dt>都城</dt><dd>${d.c}</dd>
        <dt>同期政权</dt><dd>${concurrent(d)||'—'}</dd>
        <dt>代表人物</dt><dd><div class="people">${d.p.map(x=>`<span>${x}</span>`).join('')}</div></dd>
      </dl>
      <div class="nav">
        <button id="prev" ${prev?'':'disabled'}>← 上一个<b>${prev?prev.n:'—'}</b></button>
        <button id="next" ${next?'':'disabled'}>下一个 →<b>${next?next.n:'—'}</b></button>
      </div>
    </div>
    <div>
      <div class="ev-title">大事记</div>
      <ol class="events">${d.ev.map(([y,t])=>`<li><time>${fy(y)}</time><span>${t}</span></li>`).join('')}</ol>
    </div>`;
  if(prev)$('prev').onclick=()=>select(prev.id,{center:true});
  if(next)$('next').onclick=()=>select(next.id,{center:true});
  paintState();
  if(center){
    const mid=(X(d.ds??d.s)+X(d.e))/2;
    scroll.scrollTo({left:mid-scroll.clientWidth/2,behavior:'smooth'});
  }
  if(scrollDetail)det.scrollIntoView({behavior:'smooth',block:'start'});
}
function concurrent(d){
  const a=d.ds??d.s;
  return D.filter(o=>o!==d&&(o.ds??o.s)<d.e&&o.e>a).map(o=>o.n).join('、');
}
document.addEventListener('keydown',e=>{
  if(e.target.closest('input')||!sel)return;
  const i=ORDER.indexOf(sel);
  if(e.key==='ArrowRight'&&ORDER[i+1]){select(ORDER[i+1].id,{center:true});e.preventDefault()}
  if(e.key==='ArrowLeft'&&ORDER[i-1]){select(ORDER[i-1].id,{center:true});e.preventDefault()}
});

// 搜索
$('q').addEventListener('input',e=>{
  const q=e.target.value.trim();
  if(!q){matches=null;$('qinfo').textContent='';paintState();return}
  matches=new Set(D.filter(d=>[d.n,d.f,d.c,d.sum,...d.p,...d.ev.map(x=>x[1])].join(' ').includes(q)).map(d=>d.id));
  $('qinfo').textContent=matches.size?`找到 ${matches.size} 个相关朝代，按回车查看第一个`:'没有找到，换个关键词试试';
  paintState();
});
$('q').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&matches&&matches.size){
    const first=ORDER.find(d=>matches.has(d.id));select(first.id,{center:true});
  }
});

// 一览
function buildList(){
  const maxDur=Math.max(...D.filter(d=>!d.open).map(dur));
  $('list').innerHTML=ERAS.map(e=>{
    const ds=ORDER.filter(d=>d.era===e.id);
    return `<div class="era-grp" style="--c:${ec(e.id)}"><h3>${e.name}<span>${fy(e.s)} – ${e.id==='modern'?'今':fy(e.e)}</span></h3>`+
      ds.map(d=>`<button class="row" data-id="${d.id}" style="--c:${ec(e.id)}"><b>${d.n}</b><span class="yr">${span(d)}</span><span class="dur">${dur(d)} 年</span><span class="bar" style="width:${Math.min(100,dur(d)/maxDur*100)}%"></span></button>`).join('')+
      `</div>`;
  }).join('');
  $('list').addEventListener('click',e=>{
    const r=e.target.closest('.row'); if(!r)return;
    select(r.dataset.id,{center:true});
    scroll.scrollIntoView({behavior:'smooth',block:'center'});
  });
}

// 卷首统计
$('facts').innerHTML=`
  <div class="fact"><b>${NOW+2070}</b><span>年 · 自夏朝至今</span></div>
  <div class="fact"><b>${D.length}</b><span>个收录政权</span></div>
  <div class="fact"><b>${D.reduce((n,d)=>n+d.ev.length,0)}</b><span>条大事记</span></div>`;

buildMini();
buildList();
ppy=z2p(+$('zoom').value);
render();
window.addEventListener('resize',()=>{render()});
const start=(location.hash||'').slice(1);
select(D.some(d=>d.id===start)?start:'tang',{center:true});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&(!sel||sel.id!==h))select(h,{center:true})});
</script>
</body>
</html>
